services:
  llamacpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - 8080:8080
    volumes:
      - ./llm:/models
    environment:
      LLAMA_ARG_MODEL: /models/Llama-3.2-3B-Instruct-Q6_K.gguf
      LLAMA_ARG_CTX_SIZE: 4096
      LLAMA_ARG_N_PARALLEL: 2
      LLAMA_ARG_ENDPOINT_METRICS: 1
      LLAMA_ARG_PORT: 8080

  ap-server:
    build: .
    image: ap-server
    volumes:
      - ./ml:/modules
    ports:
      - ${LTI_SERVER_PORT:-9002}:8000
    environment:
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_PASSWORD=postgres
      - TOKEN_SECRET=secret
      - LLM_SERVER_URL=http://llamacpp-server:8080
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:9.6.6
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
    - "5422:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - tunnel
    extra_hosts:
      # Workaround for environments where DNS intermittently blocks ngrok-agent domains.
      - "crl.ngrok-agent.com:18.164.124.24"
      - "update.ngrok-agent.com:3.146.191.207"
      - "connect.us.ngrok-agent.com:3.133.228.214"
      # If your tunnel domain is also blocked by corporate DNS, add its IP here.
      # Find the IP from a non-filtered network (e.g. mobile hotspot): nslookup li2026.ngrok.io 8.8.8.8
      # Then uncomment and set the correct IP:
      # - "${NGROK_DOMAIN:-li2026}.ngrok.io:<tunnel-ip>"
    command:
      - "http"
      - "--url"
      - "https://${NGROK_DOMAIN:-lti-asset-processor-${USER:-default}}.ngrok.io"
      - "--authtoken"
      - "${NGROK_AUTH}"
      - "--log"
      - "stdout"
      - "ap-server:8000"
    ports:
      - 40040:4040
