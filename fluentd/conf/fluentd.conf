<source>
  @type forward
  port 24224
</source>

<match cloudflared>
  @type file
  path /fluentd/log/tunnel
  append true

  <format>
    @type json
  </format>
  <buffer []>
    @type memory
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 100KB
    queue_limit_length 1
  </buffer>
</match>
